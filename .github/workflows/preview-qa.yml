name: Preview academic platform QA

on:
  push:
    branches:
      - 'preview/site-platform-upgrade-20261113'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check multilingual research data and document links
        run: node scripts/check-preview.mjs
